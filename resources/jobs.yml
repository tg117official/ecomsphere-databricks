# A single master job with sequential serverless notebook tasks.
# No classic cluster configuration is required for serverless notebook tasks.
resources:
  jobs:
    ecomsphere_pipeline:
      name: ecomsphere-session17-pipeline
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: batch
          default: "1"
      tasks:
        - task_key: setup
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/task.py
            base_parameters:
              stage: setup
              catalog: ${var.catalog}
              prefix: ${var.prefix}
              run_id: "{{job.run_id}}"
              module_path: ${workspace.file_path}/notebooks
        - task_key: generate_sources
          depends_on:
            - task_key: setup
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/task.py
            base_parameters:
              stage: simulate
              catalog: ${var.catalog}
              prefix: ${var.prefix}
              run_id: "{{job.run_id}}"
              module_path: ${workspace.file_path}/notebooks
        - task_key: bronze_ingestion
          depends_on:
            - task_key: generate_sources
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/task.py
            base_parameters:
              stage: ingest
              catalog: ${var.catalog}
              prefix: ${var.prefix}
              run_id: "{{job.run_id}}"
              module_path: ${workspace.file_path}/notebooks
        - task_key: quality_and_silver
          depends_on:
            - task_key: bronze_ingestion
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/task.py
            base_parameters:
              stage: silver
              catalog: ${var.catalog}
              prefix: ${var.prefix}
              run_id: "{{job.run_id}}"
              module_path: ${workspace.file_path}/notebooks
        - task_key: gold_modeling
          depends_on:
            - task_key: quality_and_silver
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/task.py
            base_parameters:
              stage: gold
              catalog: ${var.catalog}
              prefix: ${var.prefix}
              run_id: "{{job.run_id}}"
              module_path: ${workspace.file_path}/notebooks
        - task_key: reconciliation
          depends_on:
            - task_key: gold_modeling
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/task.py
            base_parameters:
              stage: reconcile
              catalog: ${var.catalog}
              prefix: ${var.prefix}
              run_id: "{{job.run_id}}"
              module_path: ${workspace.file_path}/notebooks
        - task_key: finalize
          depends_on:
            - task_key: reconciliation
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/task.py
            base_parameters:
              stage: finalize
              catalog: ${var.catalog}
              prefix: ${var.prefix}
              run_id: "{{job.run_id}}"
              module_path: ${workspace.file_path}/notebooks
        - task_key: record_failure
          depends_on:
            - task_key: setup
            - task_key: generate_sources
            - task_key: bronze_ingestion
            - task_key: quality_and_silver
            - task_key: gold_modeling
            - task_key: reconciliation
            - task_key: finalize
          run_if: AT_LEAST_ONE_FAILED
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/task.py
            base_parameters:
              stage: failure
              catalog: ${var.catalog}
              prefix: ${var.prefix}
              run_id: "{{job.run_id}}"
              module_path: ${workspace.file_path}/notebooks
    # Run only when no pipeline job is active. Explicit confirmation is mandatory.
    ecomsphere_reset:
      name: ecomsphere-session17-reset
      max_concurrent_runs: 1
      parameters:
        - name: confirmation
          default: "NO"
      tasks:
        - task_key: reset
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/task.py
            base_parameters:
              stage: reset
              catalog: ${var.catalog}
              prefix: ${var.prefix}
              run_id: "{{job.run_id}}"
              module_path: ${workspace.file_path}/notebooks
